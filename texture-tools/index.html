<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texture Tools — 90% Pad / Normal DX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Title bar -->
    <div class="titlebar">
      <span class="title">Texture Tools</span>
      <span class="subtitle">90% Edge Pad · Normal Map (DirectX)</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="pad">90% Edge Pad</button>
      <button class="tab" data-tab="normal">Normal Map (DX)</button>
    </div>

    <!-- ═══ TAB: 90% ═══ -->
    <div class="panel active" id="panel-pad">
      <div class="group">
        <div class="group-title">Input</div>
        <div class="row">
          <label>Textures</label>
          <input type="file" id="pad-files" accept="image/*" multiple>
        </div>
        <div class="row">
          <label>Scale</label>
          <input type="number" id="pad-scale" value="0.90" min="0.50" max="0.99" step="0.01" class="num">
          <span class="hint">(0.90 = 90%)</span>
        </div>
        <div class="row">
          <button id="pad-run" class="btn">Process → Download ZIP</button>
        </div>
      </div>
      <div class="group">
        <div class="group-title">Log</div>
        <div id="pad-log" class="log"></div>
      </div>
    </div>

    <!-- ═══ TAB: Normal ═══ -->
    <div class="panel" id="panel-normal">
      <div class="columns">
        <div class="col-left">
          <div class="group">
            <div class="group-title">Source</div>
            <div class="row">
              <input type="file" id="norm-file" accept="image/*">
            </div>
          </div>
          <div class="group">
            <div class="group-title">Parameters</div>
            <div class="row">
              <label>Bias</label>
              <input type="range" id="norm-bias" min="0" max="100" value="50" class="slider">
              <span id="norm-bias-val" class="val">50</span>
            </div>
            <div class="row">
              <label><input type="checkbox" id="norm-inv-r"> Invert R (X)</label>
            </div>
            <div class="row">
              <label><input type="checkbox" id="norm-inv-g" checked> Invert G (Y) — DirectX</label>
            </div>
            <div class="row">
              <label><input type="checkbox" id="norm-blur-on"> Blur</label>
            </div>
            <div class="row">
              <label>Blur amt</label>
              <input type="range" id="norm-blur" min="0" max="30" value="0" step="0.5" class="slider">
              <span id="norm-blur-val" class="val">0</span>
            </div>
            <div class="row">
              <button id="norm-gen" class="btn">Generate Preview</button>
            </div>
            <div class="row">
              <button id="norm-save" class="btn primary" disabled>Save Normal PNG</button>
            </div>
          </div>
        </div>
        <div class="col-right">
          <div class="group">
            <div class="group-title">Preview</div>
            <div class="preview-wrap">
              <canvas id="norm-preview" width="512" height="512"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span id="status">Ready</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
